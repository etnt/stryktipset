[package]
name = "reduce-web"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper around reduce_rs for tools/stryktipset/reduce.html"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reduce-rs = { path = "..", default-features = false }
serde_json = "1"
# build.sh compares the wasm-bindgen CLI version against the one locked
# in Cargo.lock, so a mismatch fails loudly instead of confusingly.
wasm-bindgen = "0.2.100"
js-sys = "0.3"

# rand's seeded RNGs do not need OS entropy, but its `getrandom` dependency
# must be told how to behave on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

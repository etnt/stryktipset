name: Build and publish web page

# Build reduce.html and publish it to GitHub Pages when a version tag
# (for example v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reduce-rs

      # Must match the wasm-bindgen version locked in reduce-rs/Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build reduce.html
        working-directory: reduce-rs
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp reduce.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
